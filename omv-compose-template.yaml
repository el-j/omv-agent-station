# ==============================================================================
# OpenMediaVault Compose Example Template: AI Agent Orchestrator Stack
# Target: openmediavault-compose plugin (OMV-Extras)
# ==============================================================================
# Description:
# 24/7 Headless AI Development & Remote Coding Server for OpenMediaVault & HP ProLiant Gen8.
# Includes LiteLLM AI Gateway (Gemini 3.7, Claude 3.7 Sonnet direct & Vertex AI, Copilot),
# Syncthing bi-directional sync for Obsidian Second Brain, Telegram Remote Agent Bot,
# and browser-based Web Terminal.
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. LiteLLM Proxy: Unified Multi-Provider AI Gateway & Rate-Limit Shield
  # ----------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - LITELLM_CONFIG_PATH=/app/config.yaml
      - STORE_MODEL_IN_DB=False
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-omv-master-key}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-europe-west1}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/vertex_creds.json
      - STORE_MODEL_IN_DB=False
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./credentials:/app/credentials:ro
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2" ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. Syncthing: Continuous Real-Time Obsidian Knowledge Base Sync
  # ----------------------------------------------------------------------------
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing-agent-hub
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./syncthing/config:/config
      - ${DATA_DIR:-/srv/dev-data}/obsidian:/data/obsidian
      - ${DATA_DIR:-/srv/dev-data}/workspace:/data/workspace
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"

  # ----------------------------------------------------------------------------
  # 3. Telegram Agent Relay Bot: Remote Control for Coding & Execution
  # ----------------------------------------------------------------------------
  telegram-bot:
    build:
      context: ./telegram-agent-bot
      dockerfile: Dockerfile
    container_name: telegram-agent-bot
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID}
      - LITELLM_API_BASE=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY:-sk-omv-master-key}
      - OBSIDIAN_VAULT_PATH=/data/obsidian
      - WORKSPACE_PATH=/data/workspace
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-OMV AI Agent}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-agent@omv-box.local}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - BITBUCKET_USERNAME=${BITBUCKET_USERNAME:-}
      - BITBUCKET_APP_PASSWORD=${BITBUCKET_APP_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ${DATA_DIR:-/srv/dev-data}/obsidian:/data/obsidian
      - ${DATA_DIR:-/srv/dev-data}/workspace:/data/workspace
      - ${DATA_DIR:-/srv/dev-data}/ssh:/root/.ssh:ro
      - ./ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ----------------------------------------------------------------------------
  # 4. Web Terminal (ttyd / cmux web bridge) - Browser Terminal Access
  # ----------------------------------------------------------------------------
  web-terminal:
    image: tsl0922/ttyd:latest
    container_name: omv-agent-terminal
    restart: unless-stopped
    environment:
      - TTYD_USER=${TERMINAL_USER:-admin}
      - TTYD_PASS=${TERMINAL_PASS:-omvsecurepass}
    volumes:
      - ${DATA_DIR:-/srv/dev-data}/workspace:/workspace
      - ${DATA_DIR:-/srv/dev-data}/obsidian:/obsidian
      - ${DATA_DIR:-/srv/dev-data}/ssh:/root/.ssh:ro
      - ./ssh:/root/.ssh:ro
    ports:
      - "7681:7681"
    command: ttyd -p 7681 -c ${TERMINAL_USER:-admin}:${TERMINAL_PASS:-omvsecurepass} tmux new-session -A -s agent-main -c /workspace bash

  # ----------------------------------------------------------------------------
  # 5. Signal Messenger Relay (Alternative E2EE Private Bot)
  # ----------------------------------------------------------------------------
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-cli
    restart: unless-stopped
    profiles: ["signal"]
    environment:
      - MODE=json-rpc
      - AUTO_RECEIVE=true
    volumes:
      - ./signal-data:/home/.local/share/signal-cli
    ports:
      - "8085:8080"

  signal-bot:
    build:
      context: ./signal-agent-bot
      dockerfile: Dockerfile
    container_name: signal-agent-bot
    restart: unless-stopped
    profiles: ["signal"]
    depends_on:
      - signal-cli
      - litellm
    environment:
      - SIGNAL_CLI_URL=http://signal-cli:8080
      - SIGNAL_PHONE_NUMBER=${SIGNAL_PHONE_NUMBER}
      - SIGNAL_ALLOWED_PHONE_NUMBER=${SIGNAL_ALLOWED_PHONE_NUMBER}
      - LITELLM_API_BASE=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY:-sk-omv-master-key}
      - OBSIDIAN_VAULT_PATH=/data/obsidian
      - WORKSPACE_PATH=/data/workspace
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-OMV AI Agent}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-agent@omv-box.local}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - BITBUCKET_USERNAME=${BITBUCKET_USERNAME:-}
      - BITBUCKET_APP_PASSWORD=${BITBUCKET_APP_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ${DATA_DIR:-/srv/dev-data}/obsidian:/data/obsidian
      - ${DATA_DIR:-/srv/dev-data}/workspace:/data/workspace
      - ${DATA_DIR:-/srv/dev-data}/ssh:/root/.ssh:ro
      - ./ssh:/root/.ssh:ro

networks:
  default:
    name: ai_orchestrator_net
