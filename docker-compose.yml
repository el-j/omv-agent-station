services:
  # ============================================================================
  # 1. LiteLLM Proxy: Unified Multi-Provider AI Gateway & Rate-Limit Shield
  # ============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - LITELLM_CONFIG_PATH=/app/config.yaml
      - STORE_MODEL_IN_DB=False
      # Master key to secure the proxy endpoint
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-omv-master-key}
      # API Keys for your active subscriptions
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # 2. Syncthing: Continuous Obsidian Vault & Workspace Sync
  # ============================================================================
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./syncthing/config:/config
      - ${DATA_DIR:-/srv/dev-data}/obsidian:/data/obsidian
      - ${DATA_DIR:-/srv/dev-data}/workspace:/data/workspace
    ports:
      - "8384:8384" # Web GUI
      - "22000:22000/tcp" # Sync protocol TCP
      - "22000:22000/udp" # Sync protocol UDP
      - "21027:21027/udp" # Local discovery

  # ============================================================================
  # 3. Telegram Agent Relay Bot: Remote Control for Coding & Execution
  # ============================================================================
  telegram-bot:
    build:
      context: ./telegram-agent-bot
      dockerfile: Dockerfile
    container_name: telegram-agent-bot
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID}
      - LITELLM_API_BASE=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY:-sk-omv-master-key}
      - OBSIDIAN_VAULT_PATH=/data/obsidian
      - WORKSPACE_PATH=/data/workspace
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ${DATA_DIR:-/srv/dev-data}/obsidian:/data/obsidian
      - ${DATA_DIR:-/srv/dev-data}/workspace:/data/workspace
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ============================================================================
  # 4. Web Terminal (ttyd / cmux web bridge) - Optional Quick Access
  # ============================================================================
  web-terminal:
    image: tsl0922/ttyd:latest
    container_name: omv-agent-terminal
    restart: unless-stopped
    environment:
      - TTYD_USER=${TERMINAL_USER:-admin}
      - TTYD_PASS=${TERMINAL_PASS:-proliantgen8}
    volumes:
      - ${DATA_DIR:-/srv/dev-data}/workspace:/workspace
      - ${DATA_DIR:-/srv/dev-data}/obsidian:/obsidian
    ports:
      - "7681:7681"
    command: ttyd -p 7681 -c ${TERMINAL_USER:-admin}:${TERMINAL_PASS:-proliantgen8} tmux new-session -A -s agent-main -c /workspace bash

networks:
  default:
    name: ai_orchestrator_net
