version: "1.0"
type: component
data:
  name: omv-services-agentstation-form-page
  type: formPage
  config:
    request:
      service: AgentStation
      get:
        method: getSettings
      post:
        method: setSettings
    fields:
      - type: checkbox
        name: enable
        label: _("Enable")
        value: false
      - type: textInput
        name: data_dir
        label: _("Data Directory")
        hint: _("Storage path for Obsidian and Workspace (e.g. /srv/dev-data)")
        value: "/srv/dev-data"
      - type: divider
        title: _("AI Model Subscriptions & Tokens")
      - type: passwordInput
        name: gemini_api_key
        label: _("Google AI Studio Key (Google AI Pro)")
        hint: _("Powers Gemini 3.7 Flash & Pro (https://aistudio.google.com/app/apikey)")
      - type: passwordInput
        name: anthropic_api_key
        label: _("Anthropic API Key (Claude Pro)")
        hint: _("Powers Claude 3.7 Sonnet Thinking (https://console.anthropic.com/)")
      - type: passwordInput
        name: github_token
        label: _("GitHub Token (Copilot Pro)")
        hint: _("Powers GPT-4o, o1, o3-mini & DeepSeek-R1 via GitHub Models")
      - type: divider
        title: _("Git Providers & Automated Versioning")
      - type: textInput
        name: git_author_name
        label: _("Git Committer Name")
        value: "OMV AI Agent"
      - type: textInput
        name: git_author_email
        label: _("Git Committer Email")
        value: "agent@omv-box.local"
      - type: passwordInput
        name: gitlab_token
        label: _("GitLab Personal Access Token")
        hint: _("Optional - for cloning & pushing to GitLab repositories")
      - type: textInput
        name: bitbucket_username
        label: _("Bitbucket Username")
        hint: _("Optional - for Bitbucket Cloud repositories")
      - type: passwordInput
        name: bitbucket_app_password
        label: _("Bitbucket App Password")
        hint: _("Optional - Bitbucket token/password with repository write permissions")
      - type: divider
        title: _("Remote Chat & Messenger Relay Service")
      - type: select
        name: chat_service
        label: _("Active Messenger Relay")
        hint: _("Choose which chat application you want to control your coding agent from")
        value: "telegram"
        options:
          - value: "telegram"
            text: _("Telegram Bot (Zero phone number / Instant setup)")
          - value: "signal"
            text: _("Signal Messenger (End-to-End Encrypted Linked Device)")
          - value: "discord"
            text: _("Discord Bot (Channels & Code Embeds / Zero phone number)")
          - value: "none"
            text: _("Disabled (Web Terminal & SSH Only)")
      - type: divider
        title: _("Telegram Bot Configuration")
      - type: passwordInput
        name: telegram_bot_token
        label: _("Telegram Bot Token")
        hint: _("From @BotFather (Leave blank if not using Telegram)")
      - type: textInput
        name: telegram_allowed_user_id
        label: _("Allowed Telegram Numeric User ID")
        hint: _("From @userinfobot (Restricts bot access to you only)")
      - type: divider
        title: _("Signal Messenger Configuration")
      - type: textInput
        name: signal_phone_number
        label: _("Signal Bot Phone / Linked Number")
        hint: _("Server Signal number or linked device number")
      - type: textInput
        name: signal_allowed_phone_number
        label: _("Allowed Personal Signal Number")
        hint: _("Your personal phone number (e.g. +491701234567)")
      - type: divider
        title: _("Discord Bot Configuration")
      - type: passwordInput
        name: discord_bot_token
        label: _("Discord Bot Token")
        hint: _("From Discord Developer Portal -> Bot -> Token")
      - type: textInput
        name: discord_allowed_user_id
        label: _("Allowed Discord User ID")
        hint: _("Your numeric Discord User ID (Right-click profile -> Copy User ID)")
      - type: divider
        title: _("Security & Web Access")
      - type: passwordInput
        name: litellm_master_key
        label: _("LiteLLM Proxy Master Key")
        value: "sk-omv-secret-master-key"
      - type: textInput
        name: terminal_user
        label: _("Web Terminal Username")
        value: "admin"
      - type: passwordInput
        name: terminal_pass
        label: _("Web Terminal Password")
        value: "omvsecurepass"
    buttons:
      - template: submit
      - template: cancel
