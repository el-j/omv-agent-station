version: "1.0"
type: component
data:
  name: omv-services-agentstation-git-form-page
  type: formPage
  config:
    hints:
      - type: info
        text: _("<strong>🔑 Quick Access Token Generators:</strong><br><br>• <a href='https://github.com/settings/tokens/new' target='_blank' style='font-weight:bold;text-decoration:underline;'>🔗 Generate GitHub Personal Access Token (PAT) ↗</a> (Recommended scopes - repo, read-user, user-email)<br>• <a href='https://gitlab.com/-/user_settings/personal_access_tokens' target='_blank' style='font-weight:bold;text-decoration:underline;'>🔗 Generate GitLab Access Token ↗</a> (Recommended scopes - api, read_repository, write_repository)<br>• <a href='https://bitbucket.org/account/settings/app-passwords/' target='_blank' style='font-weight:bold;text-decoration:underline;'>🔗 Generate Bitbucket App Password ↗</a> (Recommended permissions - Repositories Read and Write)")
    request:
      service: AgentStation
      get:
        method: getSettings
      post:
        method: setSettings
    fields:
      - type: checkbox
        name: enable_git
        label: _("Enable Automated Git Versioning & Sync")
        value: false
        hint: _("Master switch for automated git commits, second-brain versioning, and remote repository sync")
      - type: divider
        title: _("Git Committer Identity")
      - type: textInput
        name: git_author_name
        label: _("Git Author Name")
        value: ""
      - type: textInput
        name: git_author_email
        label: _("Git Author Email")
        value: ""
      - type: divider
        title: _("GitHub Integration (Recommended)")
      - type: checkbox
        name: enable_github
        label: _("Enable GitHub Repository Sync")
        value: false
      - type: textInput
        name: github_git_user
        label: _("GitHub Username or Organization")
        value: ""
        hint: _("Your GitHub account handle (e.g. el-j)")
      - type: passwordInput
        name: github_git_token
        label: _("GitHub Personal Access Token (PAT)")
        value: ""
        hint: _("Paste your GitHub token generated from the link above")
      - type: divider
        title: _("GitLab Integration")
      - type: checkbox
        name: enable_gitlab
        label: _("Enable GitLab Repository Sync")
        value: false
      - type: passwordInput
        name: gitlab_token
        label: _("GitLab Personal Access Token")
        value: ""
        hint: _("Paste your GitLab token generated from the link above")
      - type: divider
        title: _("Bitbucket Cloud Integration")
      - type: checkbox
        name: enable_bitbucket
        label: _("Enable Bitbucket Repository Sync")
        value: false
      - type: textInput
        name: bitbucket_username
        label: _("Bitbucket Username")
        value: ""
        hint: _("Your Bitbucket username")
      - type: passwordInput
        name: bitbucket_app_password
        label: _("Bitbucket App Password")
        value: ""
        hint: _("Paste your Bitbucket App Password generated from the link above")
    buttons:
      - template: submit
      - template: cancel
