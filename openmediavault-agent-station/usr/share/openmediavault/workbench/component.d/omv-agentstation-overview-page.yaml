version: "1.0"
type: component
data:
  name: omv-agentstation-overview-page
  type: formPage
  config:
    request:
      service: AgentStation
      get:
        method: getSettings
      post:
        method: setSettings
    fields:
      - type: checkbox
        name: enable
        label: _("Enable Agent Station Engine")
        value: false
        hint: _("Master switch to start/stop the AI Agent Station docker stack")
      - type: textInput
        name: data_dir
        label: _("Workspace Data Directory")
        hint: _("Storage path for Obsidian notes, code repositories, and workspace files (e.g. /srv/dev-data)")
        value: "/srv/dev-data"
      - type: divider
        title: _("Integrated Web Endpoints - Web Terminal (Port 7681) | LiteLLM (Port 4000) | Web Chat (Port 3000)")
    buttons:
      - template: submit
      - template: cancel
