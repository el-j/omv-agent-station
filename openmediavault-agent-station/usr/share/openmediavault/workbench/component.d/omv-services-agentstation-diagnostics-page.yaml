version: "1.0"
type: component
data:
  name: omv-services-agentstation-diagnostics-page
  type: formPage
  config:
    hints:
      - type: info
        text: _("<strong>📊 Real-Time Agent Station Diagnostic Center -</strong><br>Live container matrix, storage utilization, connected AI model gateways, and execution logs. Data loads automatically on page open.")
    request:
      service: AgentStation
      get:
        method: getDiagnostics
    fields:
      - type: divider
        title: _("1. Sandboxed Docker Containers & Services Status")
      - type: textarea
        name: container_status
        label: _("Live Container Matrix (Status, Memory & Ports)")
        value: ""
        readonly: true
        rows: 6
      - type: divider
        title: _("2. Storage & Sandboxed Workspace Utilization")
      - type: textarea
        name: storage_status
        label: _("Workspace, Obsidian Vault & Volume Capacity")
        value: ""
        readonly: true
        rows: 4
      - type: divider
        title: _("3. Connected AI Providers & Router Gateway")
      - type: textarea
        name: ai_status
        label: _("Active AI Model Endpoints & CLI Runtimes")
        value: ""
        readonly: true
        rows: 8
      - type: divider
        title: _("4. Live Provisioning & Docker Execution Logs")
      - type: textarea
        name: log_output
        label: _("Full Execution Stream (Image Downloads, Compose & Container Startup)")
        value: ""
        readonly: true
        rows: 18
      - type: divider
        title: _("5. Plugin Version & Updates")
      - type: textarea
        name: update_status
        label: _("Installed vs. Latest GitHub Release")
        value: ""
        readonly: true
        rows: 3
    buttons:
      - text: _("Update Plugin Now")
        icon: "mdi:cloud-download"
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Update OMV Agent Station Plugin")
              width: 75%
              startOnInit: true
              request:
                service: AgentStation
                method: updatePlugin
                task: true
              buttons:
                stop:
                  hidden: true
      - text: _("Restart Services")
        icon: "mdi:restart"
        execute:
          type: confirmationDialog
          confirmationDialog:
            title: _("Restart Agent Station Services")
            message: _("Do you really want to restart all Agent Station Docker containers (LiteLLM, Web Terminal, Syncthing, Chat Bots)? Active sessions in the Web Terminal will be interrupted.")
            confirm:
              type: request
              request:
                service: AgentStation
                method: restartServices
                progressMessage: _("Restarting Agent Station services…")
                successMessage: _("Agent Station services have been restarted.")
      - text: _("View LiteLLM Logs")
        icon: "mdi:text-box-search-outline"
        execute:
          type: formDialog
          formDialog:
            config:
              title: _("LiteLLM Gateway Logs (last 100 lines)")
              width: 75%
              request:
                service: AgentStation
                get:
                  method: getLogs
                  params:
                    service: "litellm"
              fields:
                - type: textarea
                  name: logs
                  label: _("Log Output")
                  value: ""
                  readonly: true
                  rows: 24
              buttons:
                - template: cancel
      - text: _("View Web Terminal Logs")
        icon: "mdi:text-box-search-outline"
        execute:
          type: formDialog
          formDialog:
            config:
              title: _("Web Terminal Logs (last 100 lines)")
              width: 75%
              request:
                service: AgentStation
                get:
                  method: getLogs
                  params:
                    service: "web-terminal"
              fields:
                - type: textarea
                  name: logs
                  label: _("Log Output")
                  value: ""
                  readonly: true
                  rows: 24
              buttons:
                - template: cancel
      - text: _("View Syncthing Logs")
        icon: "mdi:text-box-search-outline"
        execute:
          type: formDialog
          formDialog:
            config:
              title: _("Syncthing Logs (last 100 lines)")
              width: 75%
              request:
                service: AgentStation
                get:
                  method: getLogs
                  params:
                    service: "syncthing"
              fields:
                - type: textarea
                  name: logs
                  label: _("Log Output")
                  value: ""
                  readonly: true
                  rows: 24
              buttons:
                - template: cancel
      - text: _("View Telegram Bot Logs")
        icon: "mdi:text-box-search-outline"
        execute:
          type: formDialog
          formDialog:
            config:
              title: _("Telegram Bot Logs (last 100 lines)")
              width: 75%
              request:
                service: AgentStation
                get:
                  method: getLogs
                  params:
                    service: "telegram-bot"
              fields:
                - type: textarea
                  name: logs
                  label: _("Log Output")
                  value: ""
                  readonly: true
                  rows: 24
              buttons:
                - template: cancel
