version: "1.0"
type: component
data:
  name: omv-services-agentstation-diagnostics-page
  type: formPage
  config:
    hints:
      - type: info
        text: _("<strong>📊 Real-Time Diagnostic Center:</strong><br>This console displays live Docker container states, image download progress, and background startup logs. Click <strong>Refresh Logs</strong> below to refresh the console.")
    request:
      service: AgentStation
      get:
        method: getDiagnostics
    fields:
      - type: divider
        title: _("Agent Station Engine & Docker Container Logs")
      - type: textarea
        name: log_output
        label: _("Live Startup & Execution Logs")
        rows: 22
        disabled: true
    buttons:
      - text: _("Refresh Logs")
        icon: "mdi:refresh"
        click:
          type: reload
