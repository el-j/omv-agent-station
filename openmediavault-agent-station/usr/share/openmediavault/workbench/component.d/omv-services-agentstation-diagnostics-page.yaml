version: "1.0"
type: component
data:
  name: omv-services-agentstation-diagnostics-page
  type: formPage
  config:
    request:
      service: AgentStation
      get:
        method: getDiagnostics
    fields:
      - type: divider
        title: _("Agent Station Engine & Docker Container Logs")
      - type: html
        template: "<pre style='background-color:#1e1e2e;color:#cdd6f4;padding:16px;border-radius:8px;font-family:monospace;font-size:13px;line-height:1.5;max-height:550px;overflow-y:auto;white-space:pre-wrap;border:1px solid #313244;'>{{ log_output }}</pre>"
    buttons:
      - text: _("Refresh Logs")
        icon: "mdi:refresh"
        click:
          type: reload
