version: "1.0"
type: component
data:
  name: omv-services-agentstation-aimodels-form-page
  type: formPage
  config:
    request:
      service: AgentStation
      get:
        method: getSettings
      post:
        method: setSettings
    fields:
      - type: checkbox
        name: enable_aimodels
        label: _("Enable AI Models Provider Routing")
        value: true
      - type: divider
        title: _("AI Model Subscriptions & API Keys")
      - type: passwordInput
        name: gemini_api_key
        label: _("Google AI Studio Key (Google AI Pro)")
        hint: _("Powers Gemini 3.7 Flash & Pro (https://aistudio.google.com/app/apikey)")
      - type: passwordInput
        name: anthropic_api_key
        label: _("Anthropic API Key (Claude Pro)")
        hint: _("Powers Claude 3.7 Sonnet Thinking (https://console.anthropic.com/)")
      - type: passwordInput
        name: github_token
        label: _("GitHub Token (Copilot Pro / GitHub Models)")
        hint: _("Powers GPT-4o, o1, o3-mini & DeepSeek-R1 via GitHub Models")
    buttons:
      - template: submit
      - template: cancel
