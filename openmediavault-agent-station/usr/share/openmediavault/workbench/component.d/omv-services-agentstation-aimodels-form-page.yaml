version: "1.0"
type: component
data:
  name: omv-services-agentstation-aimodels-form-page
  type: formPage
  config:
    hints:
      - type: info
        text: _("<strong>🔑 Quick Access API Key Portals -</strong><br><br>• <a href='https://aistudio.google.com/app/apikey' target='_blank' style='font-weight:bold;text-decoration:underline;'>🔗 Google AI Studio (Gemini Pro and Flash Key) ↗</a> - Free and paid API key with high rate limits<br>• <a href='https://console.anthropic.com/settings/keys' target='_blank' style='font-weight:bold;text-decoration:underline;'>🔗 Anthropic Console (Claude 3.7 Sonnet Key) ↗</a> - Claude API developer dashboard<br>• <a href='https://github.com/settings/tokens/new' target='_blank' style='font-weight:bold;text-decoration:underline;'>🔗 GitHub Token (GPT-4o and DeepSeek via Models) ↗</a> - Personal Access Token for GitHub Models API")
    request:
      service: AgentStation
      get:
        method: getSettings
      post:
        method: setSettings
    fields:
      - type: checkbox
        name: enable_aimodels
        label: _("Enable AI Models Provider Routing")
        value: true
        hint: _("Master switch for LiteLLM multi-provider LLM gateway and automated fallback routing")
      - type: divider
        title: _("Google AI Studio (Gemini 3.7 Pro & Flash)")
      - type: checkbox
        name: enable_gemini
        label: _("Enable Google Gemini Provider")
        value: true
      - type: passwordInput
        name: gemini_api_key
        label: _("Google AI Studio API Key")
        hint: _("Paste your Gemini API key obtained from Google AI Studio")
      - type: divider
        title: _("Anthropic (Claude 3.7 Sonnet Thinking & Claude 3.5)")
      - type: checkbox
        name: enable_anthropic
        label: _("Enable Anthropic Claude Provider")
        value: true
      - type: passwordInput
        name: anthropic_api_key
        label: _("Anthropic API Key")
        hint: _("Paste your Anthropic API key obtained from the Anthropic Console")
      - type: divider
        title: _("GitHub Models (Copilot Pro / GPT-4o, o1, DeepSeek-R1)")
      - type: checkbox
        name: enable_github_models
        label: _("Enable GitHub Models Provider")
        value: true
      - type: passwordInput
        name: github_token
        label: _("GitHub Personal Access Token")
        hint: _("Paste your GitHub token for GitHub Models API access")
    buttons:
      - template: submit
      - template: cancel
