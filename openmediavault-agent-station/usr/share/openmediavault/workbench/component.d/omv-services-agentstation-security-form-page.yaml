version: "1.0"
type: component
data:
  name: omv-services-agentstation-security-form-page
  type: formPage
  config:
    request:
      service: AgentStation
      get:
        method: getSettings
      post:
        method: setSettings
    fields:
      - type: checkbox
        name: enable_security
        label: _("Enable Security Enforcement & Auth")
        value: false
      - type: divider
        title: _("LiteLLM Proxy Security")
      - type: textInput
        name: litellm_master_key
        label: _("LiteLLM Proxy Master Key")
        value: ""
      - type: divider
        title: _("Web Terminal Access Control")
      - type: textInput
        name: terminal_user
        label: _("Web Terminal Username")
        value: ""
      - type: textInput
        name: terminal_pass
        label: _("Web Terminal Password")
        value: ""
    buttons:
      - template: submit
      - template: cancel
