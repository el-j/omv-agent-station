version: "1.0"
type: dashboard-widget
data:
  id: 0d28692b-09b6-4c78-b146-5c6b1e2ffb10
  title: _("Agent Station")
  description: _("Displays live module status, active tasks, and workload for AI Agent Station.")
  type: grid
  reloadPeriod: 10000
  permissions:
    role:
      - admin
  request:
    service: AgentStation
    get:
      method: getStatus
  grid:
    item:
      content: "{{ name }}"
      tooltip: '{% if crashed %}{{ "Crashed" | translate }}{% elif enabled %}{{ "Active" | translate }}{% else %}{{ "Inactive" | translate }}{% endif %} - {{ detail }}'
      class: 'omv-text-center omv-text-nowrap {% if crashed %}omv-color-red{% elif enabled %}omv-color-green{% else %}omv-color-gray{% endif %}'
