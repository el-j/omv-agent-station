name: Release & Debian Package Publisher

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml httpx openai websockets

      - name: Run Test Suite
        run: |
          bash scripts/test.sh

      - name: Build Debian Package
        run: |
          bash build-deb.sh

      - name: Generate Checksums
        run: |
          sha256sum openmediavault-agent-station_*.deb > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openmediavault-agent-station_*.deb
            CHECKSUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
