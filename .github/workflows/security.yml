name: Security Scan & Secret Leak Detection

on:
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday at 3 AM
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning
        run: |
          bash scripts/security-check.sh

      - name: Run Bandit Vulnerability Scan
        uses: PyCQA/bandit-action@v1
        with:
          # bandit-action's real inputs are targets/severity/confidence/skips/exclude,
          # not path/level/arguments -- those don't exist on this action, so they were
          # silently ignored and Bandit ran with zero config, scanning tests/ (which
          # pyproject.toml's [tool.bandit] deliberately excludes) with no severity
          # floor. That reproduced 130+ already-triaged/nosec'd findings as fresh
          # github-advanced-security alerts on every push.
          #
          # configfile can't point at pyproject.toml here: the pinned v1 tag installs
          # plain `bandit[sarif]` (no `toml` extra), so a TOML config file always fails
          # with "toml parser not available". Mirror pyproject.toml's [tool.bandit]
          # exclude_dirs/skips directly via this action's native inputs instead.
          targets: "."
          severity: "medium"
          confidence: "medium"
          skips: "B101,B102,B404,B603,B607"
          exclude: ".svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.eggs,*.egg,./tests,./website,./build-pkg,./.github,./node_modules,./.venv,./venv"
