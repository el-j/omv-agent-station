name: Security Scan & Secret Leak Detection

on:
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday at 3 AM
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning
        run: |
          bash scripts/security-check.sh

      - name: Run Bandit Vulnerability Scan
        uses: PyCQA/bandit-action@v1
        with:
          # bandit-action's real inputs are targets/severity/confidence/configfile,
          # not path/level/arguments -- those don't exist on this action, so they
          # were silently ignored and Bandit ran with zero config, scanning tests/
          # (which pyproject.toml's [tool.bandit] deliberately excludes) with no
          # severity floor. That reproduced 130+ already-triaged/nosec'd findings
          # as fresh github-advanced-security alerts on every push.
          targets: "."
          severity: "medium"
          confidence: "medium"
          configfile: "pyproject.toml"
